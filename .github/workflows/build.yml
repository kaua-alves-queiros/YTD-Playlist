name: Build e Release

# Compila o YTD Playlist para Windows, macOS e Linux.
#
# - Push de uma tag "v*" (ex.: v1.2.0)  -> compila tudo e publica um Release com os instaladores.
# - Push na main / Pull Request          -> só compila (confere se não quebrou), sem Release.
# - Aba Actions > "Run workflow"         -> compila e deixa os arquivos para baixar em "Artifacts".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: macOS Apple Silicon
            os: macos-latest
            args: --mac --arm64
          - name: macOS Intel
            os: macos-15-intel
            args: --mac --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Em tags, a versão do app vem da tag (v1.2.0 -> 1.2.0).
      - name: Definir versão pela tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Instalar dependências
        run: npm ci

      - name: Compilar instaladores
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Sem certificado de assinatura: o macOS recebe assinatura ad-hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Além dos instaladores, envia os arquivos que o auto-update lê:
      # latest.yml (Windows), latest-linux*.yml (AppImage) e os .blockmap (download só do que mudou).
      # O macOS não se atualiza sozinho sem assinatura paga, então o latest-mac.yml fica de fora.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
            !dist/latest-mac.yml
            !dist/*.dmg.blockmap
            !dist/*.zip.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Conferir arquivos de atualização
        run: |
          ls -la artifacts
          test -f artifacts/latest.yml || { echo "::error::latest.yml (Windows) não foi gerado"; exit 1; }
          test -f artifacts/latest-linux.yml || { echo "::error::latest-linux.yml não foi gerado"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | Sistema | Arquivo |
            |---|---|
            | **Windows** (instalador) | `YTD-Playlist-Setup-*-windows-x64.exe` |
            | **Windows** (portátil, sem instalar) | `YTD-Playlist-Portable-*-windows-x64.exe` |
            | **macOS** Apple Silicon (M1/M2/M3/M4) | `YTD-Playlist-*-mac-arm64.dmg` |
            | **macOS** Intel | `YTD-Playlist-*-mac-x64.dmg` |
            | **Linux** (qualquer distro) | `YTD-Playlist-*-linux-x86_64.AppImage` / `arm64.AppImage` |
            | **Linux** Debian/Ubuntu | `YTD-Playlist-*-linux-amd64.deb` / `arm64.deb` |

            **Avisos na primeira vez (o app não tem certificado pago):**
            - **Windows:** se aparecer "O Windows protegeu o computador", clique em *Mais informações → Executar assim mesmo*.
            - **macOS:** se disser que o app "está danificado" ou "não pode ser aberto", rode no Terminal:
              `xattr -cr "/Applications/YTD Playlist.app"` e abra de novo.
            - **Linux (AppImage):** `chmod +x YTD-Playlist-*.AppImage` e execute.
